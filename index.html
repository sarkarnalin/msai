<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Web App</title>
    <style>
        /* CSS is standard and requires no pre-processors like Sass */
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .app-container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #004494;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 0.5rem;
        }

        .delete-btn {
            background-color: #dc3545;
            padding: 0.4rem 0.8rem;
            font-size: 0.9rem;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Task Tracker</h1>
        
        <div class="input-group">
            <input type="text" id="itemInput" placeholder="Enter a new item..." autocomplete="off">
            <button id="addBtn">Add</button>
        </div>

        <ul id="itemList">
            </ul>
    </div>

    <script>
        (function() {
            // Cache DOM elements
            const inputField = document.getElementById('itemInput');
            const addButton = document.getElementById('addBtn');
            const itemList = document.getElementById('itemList');

            // Function to add a new item
            function addItem() {
                const itemText = inputField.value.trim();
                
                if (itemText === '') {
                    return; // Prevent empty entries
                }

                // Create list item
                const li = document.createElement('li');
                
                // Create text node
                const span = document.createElement('span');
                span.textContent = itemText;
                
                // Create delete button
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Remove';
                deleteBtn.className = 'delete-btn';
                
                // Add event listener to delete button
                deleteBtn.addEventListener('click', function() {
                    itemList.removeChild(li);
                });

                // Assemble and append
                li.appendChild(span);
                li.appendChild(deleteBtn);
                itemList.appendChild(li);

                // Clear input and refocus
                inputField.value = '';
                inputField.focus();
            }

            // Event Listeners
            addButton.addEventListener('click', addItem);

            // Allow hitting "Enter" to add an item
            inputField.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    addItem();
                }
            });
        })();
    </script>
</body>
</html>
