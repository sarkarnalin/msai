<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRouter AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --sidebar-color: #ffffff;
            --text-color: #333;
            --chat-bg: #ffffff;
            --user-msg-bg: #007bff;
            --bot-msg-bg: #e9ecef;
            --accent-color: #007bff;
            --border-color: #ddd;
        }

        [data-theme="dark"] {
            --bg-color: #0b141a;
            --sidebar-color: #111b21;
            --text-color: #e9edef;
            --chat-bg: #0b141a;
            --user-msg-bg: #005c4b;
            --bot-msg-bg: #202c33;
            --accent-color: #00a884;
            --border-color: #313d45;
        }

        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: 0.3s;
        }

        header {
            background-color: var(--sidebar-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo { font-weight: 600; font-size: 1.2rem; color: var(--accent-color); }

        /* Settings Modal */
        #settingsOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
        }

        .settings-modal {
            background: var(--sidebar-color);
            width: 90%; max-width: 400px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 15px;
            position: relative;
        }

        /* Chat Area */
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message { align-self: flex-end; background-color: var(--user-msg-bg); color: white; border-bottom-right-radius: 2px; }
        .bot-message { align-self: flex-start; background-color: var(--bot-msg-bg); color: var(--text-color); border-bottom-left-radius: 2px; }

        /* Input Area */
        .input-group {
            padding: 15px 20px;
            background: var(--sidebar-color);
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border-color);
        }

        input, select {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-color); color: var(--text-color);
        }

        .chat-input { flex: 1; margin-bottom: 0; border-radius: 25px; }

        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: var(--accent-color); color: white; }
    </style>
</head>
<body data-theme="light">

<header>
    <div class="logo">OpenRouter AI</div>
    <button class="btn btn-primary" onclick="openSettings()">Settings ⚙️</button>
</header>

<div id="settingsOverlay">
    <div class="settings-modal">
        <h3>Settings</h3>
        <label>OpenRouter API Key:</label>
        <input type="password" id="apiKey" placeholder="sk-or-v1-...">
        
        <label>Model ID:</label>
        <input type="text" id="modelName" placeholder="google/gemini-2.0-flash-exp:free">
        
        <label>Theme:</label>
        <select id="themeSelect" onchange="applyTheme()">
            <option value="light">Light Mode ☀️</option>
            <option value="dark">Dark Mode 🌙</option>
        </select>

        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" style="flex: 1;" onclick="saveSettings()">Save</button>
            <button class="btn" onclick="closeSettings()">Close</button>
        </div>
        <button class="btn" style="width: 100%; margin-top: 10px; background: #ff4757; color: white;" onclick="clearHistory()">Clear History</button>
    </div>
</div>

<div id="chat-window"></div>

<div class="input-group">
    <input type="text" id="userInput" class="chat-input" placeholder="এখানে লিখুন..." onkeypress="if(event.key === 'Enter') handleSend()">
    <button class="btn btn-primary" onclick="handleSend()">Send</button>
</div>

<script>
    let chatHistory = JSON.parse(localStorage.getItem('openrouter_chat')) || [];
    const chatWindow = document.getElementById('chat-window');

    window.onload = () => {
        const config = JSON.parse(localStorage.getItem('ai_config')) || { theme: 'light', model: 'google/gemini-2.0-flash-exp:free' };
        document.body.setAttribute('data-theme', config.theme);
        document.getElementById('themeSelect').value = config.theme;
        document.getElementById('apiKey').value = config.apiKey || '';
        document.getElementById('modelName').value = config.model;
        renderChat();
    };

    function openSettings() { document.getElementById('settingsOverlay').style.display = 'block'; }
    function closeSettings() { document.getElementById('settingsOverlay').style.display = 'none'; }

    function applyTheme() {
        const theme = document.getElementById('themeSelect').value;
        document.body.setAttribute('data-theme', theme);
    }

    function saveSettings() {
        const config = {
            apiKey: document.getElementById('apiKey').value,
            model: document.getElementById('modelName').value || 'google/gemini-2.0-flash-exp:free',
            theme: document.getElementById('themeSelect').value
        };
        localStorage.setItem('ai_config', JSON.stringify(config));
        alert('Settings Saved!');
        closeSettings();
    }

    function renderChat() {
        chatWindow.innerHTML = '';
        chatHistory.forEach(msg => addMessageToUI(msg.role, msg.content));
    }

    function addMessageToUI(role, text) {
        const div = document.createElement('div');
        div.className = `message ${role === 'user' ? 'user-message' : 'bot-message'}`;
        div.innerText = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function handleSend() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        const config = JSON.parse(localStorage.getItem('ai_config'));

        if (!text) return;
        if (!config || !config.apiKey) {
            alert("Settings থেকে API Key দিন!");
            openSettings();
            return;
        }

        addMessageToUI('user', text);
        chatHistory.push({ role: 'user', content: text });
        input.value = '';

        const botDiv = document.createElement('div');
        botDiv.className = 'message bot-message';
        botDiv.innerText = 'AI ভাবছে...';
        chatWindow.appendChild(botDiv);

        try {
            const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.apiKey}`,
                    'HTTP-Referer': window.location.origin,
                    'X-Title': 'GitHub AI Chatbot'
                },
                body: JSON.stringify({
                    model: config.model,
                    messages: chatHistory
                })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message || "API Error");

            const botReply = data.choices[0].message.content;
            botDiv.innerText = botReply;
            chatHistory.push({ role: 'assistant', content: botReply });
            localStorage.setItem('openrouter_chat', JSON.stringify(chatHistory));
            chatWindow.scrollTop = chatWindow.scrollHeight;

        } catch (err) {
            botDiv.innerText = "Error: " + err.message;
            botDiv.style.color = "red";
        }
    }

    function clearHistory() {
        if(confirm("সব চ্যাট মুছে ফেলতে চান?")) {
            localStorage.removeItem('openrouter_chat');
            chatHistory = [];
            renderChat();
        }
    }
</script>

</body>
</html>
