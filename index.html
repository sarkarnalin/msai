<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <style>
        :root {
            --primary-color: #202123;
            --sidebar-color: #444654;
            --text-color: #ffffff;
            --accent-color: #10a37f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header & Settings */
        header {
            background-color: var(--sidebar-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .settings-panel {
            display: none;
            position: fixed;
            top: 60px;
            right: 20px;
            background: #343541;
            padding: 20px;
            border-radius: 8px;
            z-index: 100;
            border: 1px solid #565869;
        }

        /* Chat Container */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--accent-color);
        }

        .bot-message {
            align-self: flex-start;
            background-color: var(--sidebar-color);
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background-color: var(--primary-color);
            border-top: 1px solid #565869;
            display: flex;
            gap: 10px;
        }

        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #565869;
            background: #40414f;
            color: white;
        }

        button {
            padding: 10px 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<header>
    <strong>My AI Chatbot</strong>
    <button onclick="toggleSettings()">Settings ⚙️</button>
</header>

<div class="settings-panel" id="settingsPanel">
    <h3>Settings</h3>
    <label>OpenAI API Key:</label><br><br>
    <input type="password" id="apiKeyInput" placeholder="sk-...">
    <br><br>
    <button onclick="saveSettings()">Save API Key</button>
    <button onclick="clearChat()" style="background: #eb4034;">Clear History</button>
</div>

<div id="chat-container">
    </div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Type your message here..." onkeypress="if(event.key === 'Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
    let chatHistory = JSON.parse(localStorage.getItem('chat_history')) || [];
    const chatContainer = document.getElementById('chat-container');

    // Load history on start
    window.onload = () => {
        const savedKey = localStorage.getItem('openai_api_key');
        if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
        renderHistory();
    };

    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function saveSettings() {
        const key = document.getElementById('apiKeyInput').value;
        localStorage.setItem('openai_api_key', key);
        alert('Settings saved!');
        toggleSettings();
    }

    function renderHistory() {
        chatContainer.innerHTML = '';
        chatHistory.forEach(msg => {
            appendMessage(msg.role, msg.content);
        });
    }

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = `message ${role === 'user' ? 'user-message' : 'bot-message'}`;
        div.innerText = text;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        const apiKey = localStorage.getItem('openai_api_key');

        if (!text) return;
        if (!apiKey) {
            alert("Please add your API Key in Settings first!");
            return;
        }

        // Add user message to UI and history
        appendMessage('user', text);
        chatHistory.push({ role: 'user', content: text });
        input.value = '';

        try {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-3.5-turbo",
                    messages: chatHistory
                })
            });

            const data = await response.json();
            const botReply = data.choices[0].message.content;

            // Add bot message to UI and history
            appendMessage('assistant', botReply);
            chatHistory.push({ role: 'assistant', content: botReply });
            
            // Save to localStorage
            localStorage.setItem('chat_history', JSON.stringify(chatHistory));

        } catch (error) {
            appendMessage('assistant', 'Error: Could not connect to API. Check your Key.');
            console.error(error);
        }
    }

    function clearChat() {
        localStorage.removeItem('chat_history');
        chatHistory = [];
        renderHistory();
        alert('Chat history cleared!');
    }
</script>

</body>
</html>
